<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Biometric Enrollment Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .nav { max-width: 1200px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 24px; border-radius: 12px; border: 1px solid #334155; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: 600; padding: 8px 16px; border-radius: 8px; }
        .nav-links a.active, .nav-links a:hover { background: #2563eb; color: #fff; }
        .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
        .form-group input, .form-group select { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
        .btn { background: #2563eb; color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; font-size: 15px; margin-top: 10px; }

        /* Biometric Phone-Style Camera View */
        .scanner-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .phone-frame { position: relative; width: 320px; height: 320px; border-radius: 50%; border: 4px solid #3b82f6; overflow: hidden; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); margin: 20px 0; }
        .phone-frame img { width: 100%; height: 100%; object-fit: cover; }
        .progress-ring { font-size: 32px; font-weight: 800; color: #60a5fa; margin-top: 10px; }
        .meter-container { width: 100%; background: #0f172a; height: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #334155; margin-top: 12px; }
        .meter-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2563eb, #60a5fa); transition: width 0.3s linear; }
        .status-text { margin-top: 8px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>Biometric Face Registration</h2>
        <div class="nav-links">
            <a href="/">Live Scanner</a>
            <a href="/students">Student Roster</a>
            <a href="/enroll" class="active">+ Register Student</a>
        </div>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Student Profile Information</h3>
            <form id="enrollForm" style="margin-top: 20px;">
                <div class="form-group"><label>Enrollment Number</label><input type="text" id="enroll_no" placeholder="EN202601" required></div>
                <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Rahul Sharma" required></div>
                <div class="form-group"><label>Course</label><input type="text" id="course" placeholder="Computer Science" required></div>
                <div class="form-group"><label>Year</label>
                    <select id="year"><option value="1st Year">1st Year</option><option value="2nd Year">2nd Year</option><option value="3rd Year" selected>3rd Year</option><option value="4th Year">4th Year</option></select>
                </div>
                <button type="button" class="btn" onclick="startBiometricCapture()">Start 50-Second Face Scan</button>
            </form>
        </div>

        <div class="card scanner-card">
            <h3>Phone-Style Face ID Scanner</h3>
            <div class="phone-frame">
                <img src="{{ url_for('video_feed') }}" alt="Biometric Webcam Stream">
            </div>
            <div class="progress-ring" id="percentageText">0%</div>
            <div class="status-text" id="statusLabel">Fill out form and click Start to begin facial scan</div>
            <div class="meter-container">
                <div class="meter-fill" id="meterFill"></div>
            </div>
        </div>
    </div>

    <script>
        function startBiometricCapture() {
            const enroll_no = document.getElementById('enroll_no').value;
            const name = document.getElementById('name').value;
            const course = document.getElementById('course').value;
            const year = document.getElementById('year').value;

            if(!enroll_no || !name || !course) {
                alert('Please fill out all student profile fields.');
                return;
            }

            // Start 50-second visual countdown
            let elapsed = 0;
            const totalTime = 50;
            const statusLabel = document.getElementById('statusLabel');
            const percentageText = document.getElementById('percentageText');
            const meterFill = document.getElementById('meterFill');

            statusLabel.innerText = "Scanning face angles... Move head slowly.";
            
            const timer = setInterval(() => {
                elapsed += 1;
                const percent = Math.min(Math.round((elapsed / totalTime) * 100), 100);
                percentageText.innerText = percent + "%";
                meterFill.style.width = percent + "%";

                if (elapsed >= totalTime) {
                    clearInterval(timer);
                }
            }, 1000);

            // Call backend endpoint to trigger webcam image sampling
            fetch('/register_student_api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enroll_no, name, course, year })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    statusLabel.innerText = "Face Scan Complete! Profile saved.";
                    percentageText.innerText = "100%";
                    meterFill.style.width = "100%";
                    setTimeout(() => { window.location.href = '/students'; }, 2000);
                } else {
                    alert(data.message);
                    clearInterval(timer);
                }
            })
            .catch(err => {
                console.error(err);
                clearInterval(timer);
            });
        }
    </script>
</body>
</html>
