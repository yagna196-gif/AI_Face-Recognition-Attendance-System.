<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .nav { max-width: 1400px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 24px; border-radius: 12px; border: 1px solid #334155; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: 600; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a.active, .nav-links a:hover { background: #2563eb; color: #fff; }
        .grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; }
        .cam-box { width: 100%; border-radius: 8px; overflow: hidden; background: #000; height: 480px; display: flex; align-items: center; justify-content: center; }
        .cam-box img { width: 100%; height: 100%; object-fit: cover; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th { background: #0f172a; padding: 12px; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
        .badge { background: #166534; color: #4ade80; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>AI Attendance Terminal</h2>
        <div class="nav-links">
            <a href="/" class="active">Live Scanner</a>
            <a href="/students">Student Roster</a>
            <a href="/enroll">+ Register Student</a>
        </div>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Live Webcam Scan</h3>
            <div class="cam-box" style="margin-top: 15px;">
                <img src="{{ url_for('video_feed') }}" alt="Webcam Feed">
            </div>
        </div>
        <div class="card">
            <h3>Today's Attendance Logs</h3>
            <table>
                <thead>
                    <tr><th>Enroll No</th><th>Name</th><th>Time</th><th>Status</th></tr>
                </thead>
                <tbody>
                    {% for r in logs %}
                    <tr><td><strong>{{ r[0] }}</strong></td><td>{{ r[1] }}</td><td>{{ r[5] }}</td><td><span class="badge">{{ r[6] }}</span></td></tr>
                    {% else %}
                    <tr><td colspan="4" style="text-align: center; color: #64748b; padding: 30px;">No logs recorded today.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
